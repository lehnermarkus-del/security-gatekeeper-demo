name: Security Gatekeeper Pipeline

on:
  push:
    branches: [ "main", "vulnerable" ]
  workflow_dispatch:

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build Docker Image
        run: docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/security-gatekeeper-demo:${{ github.sha }} .
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.ACR_LOGIN_SERVER }}/security-gatekeeper-demo:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true
      - name: Push Image to ACR
        if: success() && github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/security-gatekeeper-demo:${{ github.sha }}
